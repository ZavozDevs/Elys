settings:
  choose_installation: '{e:glowing_star} <b>Выберите вариант установки Elys:</b>'
  vds_install: '{e:diamond} Процесс установки на VDS выполняется одной командой:

    <pre><code class="language-shell">sudo apt update &amp;&amp; sudo apt upgrade -y &amp;&amp; sudo apt install git python3-pip &amp;&amp; git clone https://github.com/ZavozDevs/Elys &amp;&amp; cd Elys &amp;&amp; pip install -r requirements.txt &amp;&amp; python3 -m elys</code></pre>

    <i>Примечание: Если у вас отсутствуют права sudo, исключите соответствующую часть команды.</i>'
  wsl_install: "<b>Скачай WSL.</b> Для этого открой PowerShell с правами администратора и напиши <code>wsl --install -d Ubuntu-22.04</code> \n⚠️ <i>Для установки WSL необходима Windows 10 build 2004 или Windows 11 любой версии и ПК с поддержкой виртуализации. Для установки на более ранние версии ОС обратись к</i> <a href=\"https://learn.microsoft.com/ru-ru/windows/wsl/install-manual\">этой странице</a>\n\n⬜️ <b>Перезагрузи ПК и запусти приложение Ubuntu 22.04.x</b> \n\n⬜️ <b>Вставь в него команду (ПКМ):</b> <code>curl -Ss https://bootstrap.pypa.io/get-pip.py | python3</code> \n⚠️ <i>При появлении желтых предупреждений введи</i> <code>export PATH=\"/home/username/.local/bin:$PATH\"</code> <i>заменив /home/username/.local/bin на тот путь, о котором говорится в сообщении</i>\n\n⬜️ <b>Вставь команду (ПКМ):</b> \n<pre><code class=\"language-bash\">clear &amp;&amp; git clone https://github.com/ZavozDevs/Elys &amp;&amp; cd Elys &amp;&amp; pip install -r requirements.txt &amp;&amp; python3 -m elys</code></pre>\n\U0001F517 <b>Где получить API_ID и API_HASH?</b>: <a href=\"https://youtu.be/DcqDA249Lhg?t=24\">Видео</a>"
  userland_install: '<b>Установи UserLAnd по</b> <a href="https://play.google.com/store/apps/details?id=tech.ula">ссылке</a>


    <b>Открой его, выбери Ubuntu —&gt; Minimal —&gt; Terminal</b>


    <b>Жди установки дистрибутива, можешь налить чаю</b>


    <b>После успешной установки перед тобой откроется терминал, пиши туда:</b>

    <pre><code class="language-bash">sudo apt update &amp;&amp; sudo apt upgrade -y &amp;&amp; sudo apt install python3 git python3-pip -y &amp;&amp; git clone https://github.com/ZavozDevs/Elys &amp;&amp; cd Elys &amp;&amp; sudo pip install -r requirements.txt &amp;&amp; python3 -m elys</code></pre>


    <b>В конце установки появится ссылка, переходи по ней и вводи данные своего аккаунта для входа.


