loader_restrictor:
  q1: Що насправді може зробити будь-який встановлений вами модуль?
  q1_ans1: Саме те, що сказано в його описі - нічого більше
  q1_ans2: Читати повідомлення тільки в тому чаті, куди було викликано
  q1_ans3: Дійте лише тоді, коли ви явно викликаєте його команду
  q1_ans4: 'Те саме, що ти в Telegram, і більше: надсилання подарунків, видалення облікового запису'
  q1_hint: Хоча userbot має базовий захист від небезпечних запитів, модуль може отримати повний контроль над вашим обліковим записом
  q2: Вам надсилає повідомлення незнайомець і просить перевірити його модуль. чим ти займаєшся
  q2_ans1: Звичайно, чому б їм не допомогти?
  q2_ans2: 'Перевірте код самостійно/за допомогою ШІ. Якщо не впевнені, повідомте з #check_scam'
  q2_ans3: Запитайте автора, чи це безпечно, і повірте їм на слово
  q2_ans4: Встановіть його на інший обліковий запис, щоб перевірити – так безпечніше
  q2_hint: Будь-який модуль не з офіційних каналів розробника слід перевіряти на наявність небезпечного коду. Не піддавайте себе ризику!
  q3: Чи може модуль працювати з файлами та системою сервера/хостингу, а не тільки з Telegram?
  q3_ans1: Ні, модуль працює лише всередині Telegram і не може бачити інші файли
  q3_ans2: Тільки якщо він має окремий дозвіл від Telegram
  q3_ans3: 'Так, модуль є частиною юзербота: він може читати, змінювати, видаляти файли'
  q3_ans4: Тільки фото та відео з Telegram
  q3_hint: Userbot — це програма Python, яка працює на вашому сервері. Модуль є частиною тієї самої програми з такими ж правами
  q4: Чи помітили б ви, якби модуль почав діяти без вашого дозволу (викрадення даних тощо)?
  q4_ans1: Так, Telegram негайно повідомляв мене про підозрілу активність
  q4_ans2: Так, я б помітив підозрілі журнали з модуля
  q4_ans3: Ні, але базовий захист юзербота має фіксувати таку активність
  q4_ans4: Не обов'язково - модуль може діяти непомітно, без будь-яких сповіщень, поки не стане надто пізно
  q4_hint: 'Прихованість — головна небезпека шкідливих модулів: без попередньої перевірки коду ви можете просто не помітити проблему, поки не стане надто пізно'
  timeout: '{e:warn} <b>Ви не вчасно відповіли на всі питання. Ви можете спробувати ще раз, надіславши </b> <code>/start lm_verify</code>'
