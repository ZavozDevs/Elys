  backup_sent: '{e:package} <b>Резервну копію надіслано до <a href={}>чату з базами даних</a></b>'
  backupall_sent: '{e:package} <b>Резервна копія бази та модулів надіслана в <a href={}>чат з базами даних</a></b>'
  db_warning: '❗️ Виявлено резервну копію Hikka. Якщо ви продовжите, користувач-бот <b>спробує</b> конвертувати її у формат, придатний для Elys.

