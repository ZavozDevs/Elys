loader_restrictor:
  q1: Модуль, который ты ставишь. Че он умеет по факту?
  q1_ans1: Только то, что в описании написано, не больше
  q1_ans2: Читать переписку только в том чате, где его вызвали
  q1_ans3: Действовать только когда сам вызвал команду
  q1_ans4: 'То же самое, что и ты сам в Телеге, и даже больше: подарки слить, акк удалить'
  q1_hint: В юзерботе есть базовая защита, но модуль всё равно может получить полный контроль над акком
  q2: Тебе в лс пишет рандом и просит потестить его модуль. Твои действия?
  q2_ans1: Конечно помогу, как не помочь
  q2_ans2: 'Гляну код сам/нейронкой. Если сомнения - в саппорт с #check_scam, скажу кто скинул'
  q2_ans3: Спрошу у автора безопасен ли он, поверю на слово
  q2_ans4: Поставлю на запасной акк потестить, так безопаснее
  q2_hint: Модули не из официальных каналов - жди подвоха, всегда проверяй код
  q3: Может ли модуль лазить по файлам и системе сервера, а не только в Телеге сидеть?
  q3_ans1: Не, модуль живёт только в Телеге, файлы не видит
  q3_ans2: Может, но ток с файлами, которые он сам создал или скачал
  q3_ans3: Может - модуль это часть самого юзербота, может читать/менять/удалять файлы как обычная программа
  q3_ans4: Только фотки и видосы из Телеги
  q3_hint: Юзербот - обычный питон-скрипт на твоём сервере. Модуль - часть этого скрипта с теми же правами
  q4: Заметишь если модуль начнёт суету без спроса (слив данных и т.д.)?
  q4_ans1: Ага, Телега сразу пришлёт пуш о подозрительной активности
  q4_ans2: Ага, увижу подозрительные логи от модуля
  q4_ans3: Не, но базовая защита юзербота должна словить это
  q4_ans4: Не факт - модуль может суетить втихую, без единого шороха, пока не будет поздно
  q4_hint: 'Скрытность - вот что реально страшно в опасных модулях: без проверки кода заранее не заметишь беду, пока гром не грянет'
