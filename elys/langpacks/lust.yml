    команды.</i>'
  wsl_install: "<b>Скачай WSL.</b> Для этого открой PowerShell с правами администратора\
    \ и напиши <code>wsl --install -d Ubuntu-22.04</code> \n⚠️ <i>Для установки WSL\
    \ необходима Windows 10 build 2004 или Windows 11 любой версии и ПК с поддержкой\
    \ виртуализации. Для установки на более ранние версии ОС обратись к</i> <a href=\"\
