loader_restrictor:
  q1: На что способен любой модульчик ♡, который вы устанавливаете?
  q1_ans1: Ровно то, что написано в его описании - не больше и не меньше ♡ 🫦
  q1_ans2: Может читать переписку только в том чате, где его вызвали ♡ 🫦
  q1_ans3: Может действовать только тогда, когда вы сами вызываете его команду ♡ 🫦
  q1_ans4: 'То же самое, что и вы сами в Telegram, и даже больше: передача подарков,
    удаление аккаунта и т.д. ♡ 🫦'
  q1_hint: Хотя в юзерботе стоит базовая защита от опасных запросов, модульчик ♡ всё
    ещё может получить полное управление вашим аккаунтом
  q2: Вам написал незнакомец и просит протестировать его модульчик ♡. Ваши действия?
  q2_ans1: Конечно помогу ему, почему бы и Не надо, больно~ 🚫?
  q2_ans2: 'Проверю код (сам/нейросетью). При сомнениях напишу в саппорт с #check_scam,
    укажу, кто поделился ♡ 🫦'
  q2_ans3: Спрошу у самого автора, безопасен ли модульчик ♡, поверю ему на слово
  q2_ans4: Установлю на другом аккаунте, чтобы протестировать, так безопаснее ♡ 🫦
  q2_hint: Любые модульчики ♡ не из каналов официальных разработчиков ('#modules'
    в саппорте/чате оффтопа) стоит проверять на наличие опасного кода. Не подвергайте
    себя риску!
  q3: Может ли модульчик ♡ работать с файлами и системой сервера/хостинга, а не только
    с Telegram?
  q3_ans1: Не надо, больно~ 🚫, модульчик ♡ работает только внутри Telegram и не видит
    остальные файлы
  q3_ans2: Только если у него есть отдельное допуск к шалостям ♡ от Telegram
  q3_ans3: 'Да, папочка ♡ 💋 - модульчик ♡ это часть самого твоего покорного фембойчика
    Elys ♡: может читать, менять и удалять файлы, как и любая программа'
  q3_ans4: Только фото и видео из Telegram ♡ 🫦
  q3_hint: твой покорный фембойчик Elys ♡ - это программа на Python, запущенная на
