loader_restrictor:
  q1: На что способен любой модуль, который вы устанавливаете?
  q1_ans1: Ровно то, что написано в его описании - не больше и не меньше
  q1_ans2: Может читать переписку только в том чате, где его вызвали
  q1_ans3: Может действовать только тогда, когда вы сами вызываете его команду
  q1_ans4: 'То же самое, что и вы сами в Telegram, и даже больше: передача подарков,
    удаление аккаунта и т.д.'
  q1_hint: Хотя в юзерботе стоит базовая защита от опасных запросов, модуль всё ещё
    может получить полное управление вашим аккаунтом
  q2: Вам написал незнакомец и просит протестировать его модуль. Ваши действия?
  q2_ans1: Конечно помогу ему, почему бы и нет?
  q2_ans2: 'Проверю код (сам/нейросетью). При сомнениях напишу в саппорт с #check_scam,
    укажу, кто поделился'
  q2_ans3: Спрошу у самого автора, безопасен ли модуль, поверю ему на слово
  q2_ans4: Установлю на другом аккаунте, чтобы протестировать, так безопаснее
  q2_hint: Любые модули не из каналов официальных разработчиков ('#modules' в саппорте/чате
    оффтопа) стоит проверять на наличие опасного кода. Не подвергайте себя риску!
  q3: Может ли модуль работать с файлами и системой сервера/хостинга, а не только
    с Telegram?
  q3_ans1: Нет, модуль работает только внутри Telegram и не видит остальные файлы
  q3_ans2: Только если у него есть отдельное разрешение от Telegram
  q3_ans3: 'Да - модуль это часть самого юзербота: может читать, менять и удалять
    файлы, как и любая программа'
  q3_ans4: Только фото и видео из Telegram
  q3_hint: Юзербот - это программа на Python, запущенная на вашем сервере. Модуль
    - часть этой программы с теми же правами
  q4: Заметите ли вы, если модуль начнёт действовать без вашего разрешения (кража
    данных и т.д.)?
  q4_ans1: Да, Telegram сразу пришлёт уведомление о подозрительной активности
  q4_ans2: Да, я замечу подозрительные логи от модуля
  q4_ans3: Нет, но базовая защита юзербота должна перехватить такую активность
  q4_ans4: Не обязательно - модуль может действовать незаметно, без уведомлений, пока
    не станет поздно
  q4_hint: 'Скрытность - главная опасность вредоносных модулей: без проверки кода
    заранее вы можете просто не заметить проблему, пока не станет поздно'
  timeout: <tg-emoji emoji-id=5447644880824181073>⚠️</tg-emoji> <b>Вы не успели ответить
    на все вопросы вовремя. Можете попробовать снова, отправив</b> <code>/start lm_verify</code>
  failed: <tg-emoji emoji-id=5210952531676504517>🚫</tg-emoji> <b>Ответ неверный. Чтобы
    разблокировать установку сторонних модулей, попробуйте снова, отправив</b> <code>/start
    lm_verify</code>
  already_passed: <tg-emoji emoji-id=5118861066981344121>✅</tg-emoji> <b>Вы уже прошли
    проверку - установка сторонних модулей разблокирована</b>
  unlock_prompt: <tg-emoji emoji-id=5447644880824181073>⚠️</tg-emoji> <b>Рекомендуем
    пройти проверку для разблокировки возможности установки сторонних модулей</b>
  unlock_prompt_btn: Пройти проверку
